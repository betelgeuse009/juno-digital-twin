bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: hero
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: /home/ubuntu/Workspace/ros-bridge/src/carla_ros_bridge/launch/configs/juno_custom_navigate_to_pose.xml
    default_nav_through_poses_bt_xml: /home/ubuntu/Workspace/ros-bridge/src/carla_ros_bridge/launch/configs/juno_custom_navigate_through_poses.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_remove_passed_goals_action_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    publish_zero_velocity: false
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 5.0 # to be checked
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 5.0
      yaw_goal_tolerance: 0.2 # 1 radian 57 degrees
    path_handler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 5.56  # maximum velocity projection forward, threshold to consider
      minimum_rotation_angle: 0.785 # The minimum accumulated rotation (in radians) required to classify a segment as an in-place rotation. 0.785 rad = 45 deg.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 2.78 # in m/s 
      lookahead_dist: 7.5
      min_lookahead_dist: 2.5
      max_lookahead_dist: 10.0
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 0.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 9.1
      regulated_linear_scaling_min_speed: 1.0
      use_rotate_to_heading: false
      max_angular_accel: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map 
      robot_base_frame: hero
      footprint: "[[-0.443, -0.608], [-0.443, 0.608], [2.445, 0.608], [2.445, -0.608]]"
      footprint_padding: 0.1
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.2
      static_map: false
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: laser_scan
        laser_scan:
          topic: /carla/hero/semantic_lidar
          data_type: "PointCloud2"
          expected_update_rate: 5.0
          obstacle_max_range: 15.0   # Maximum range to mark obstacles (meters)
          raytrace_range: 100.0   # Maximum range to clear free space (meters)
          marking: True
          clearing: True
          min_obstacle_height: 0.1
          max_obstacle_height: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 1.56
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: hero
      footprint: "[[-0.443, -0.608], [-0.443, 0.608], [2.445, 0.608], [2.445, -0.608]]"
      footprint_padding: 0.1
      resolution: 0.05
      width: 40
      height: 40
      rolling_window: true
      track_unknown_space: false 
      static_map: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: laser_scan
        laser_scan:
          topic: /carla/hero/semantic_lidar
          data_type: "PointCloud2"
          expected_update_rate: 5.0
          obstacle_max_range: 15.0   # Maximum range to mark obstacles (meters)
          raytrace_range: 100.0   # Maximum range to clear free space (meters)
          marking: True
          clearing: True
          min_obstacle_height: 0.1
          max_obstacle_height: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 1.0
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 1.5
      downsample_costmap: false
      allow_unknown: true
      max_planning_time: 5.0
      non_straight_penalty: 1.20
      debug_visualizations: true # pretty heavy disable if not debug to show expansions and footprint
      cache_obstacle_heuristic: true # Since the obstacles are static
      goal_heading_mode: ALL_DIRECTION # DEFAULT meaning same orientation by the goal, BIDIRECTIONAL, ALL_DIRECTION
      minimum_turning_radius: 9.1 # Rmin = Wheelbase/tan(max_degree°)  => 1.6/tan(10°)=9.074
      angle_quantization_bins: 72

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["drive_on_heading", "wait"]
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: "hero"
    transform_tolerance: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.05
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [5.56, 0.0, 0.61]
    min_velocity: [0.0, 0.0, -0.61]
    max_accel: [1.0, 0.0, 0.5]
    max_decel: [-1.5, 0.0, -0.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
